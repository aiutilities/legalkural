[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legalkural-engine"
version = "0.1.0"
description = "ThinkingOS engine for Legal Kural"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
legalkural = "legalkural.cli:main"

[tool.setuptools]
package-dir = {"" = "engine"}

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
pythonpath = ["engine"]
testpaths = ["engine/tests"]
